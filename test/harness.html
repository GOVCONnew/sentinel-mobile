<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SENTINEL 2.0 · model test harness</title><link rel="icon" href="../icons/icon-192.png"><link rel="stylesheet" href="../css/app.css">
<style>html,body{overflow:auto;height:auto}body{padding:16px;-webkit-user-select:text;user-select:text}.panels{display:flex;gap:14px;flex-wrap:wrap}.p{border:1px solid var(--line);border-radius:10px;padding:8px}.p h3{margin:0 0 6px}pre{font-size:11px;background:#0a0f06;border:1px solid var(--line);padding:8px;white-space:pre-wrap;max-width:1300px}</style></head>
<body><h2>NEWTON · SENTINEL 2.0 <small>model test harness</small></h2><div id="verdict" class="muted">running…</div>
<div class="panels"><div class="p"><h3>A · EfficientDet-Lite0 (default)</h3><canvas id="cA" style="width:330px;height:464px"></canvas></div>
<div class="p"><h3>B · YOLO11n @416</h3><canvas id="cB" style="width:330px;height:464px"></canvas></div>
<div class="p"><h3>C · COCO-SSD lite (fallback)</h3><canvas id="cC" style="width:330px;height:464px"></canvas></div>
<div class="p"><h3>D · YAMNet on dog_bark.wav</h3><div id="yam" style="width:320px"></div></div></div>
<pre id="log"></pre>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script>window.SENTINEL_BASE = '../';</script>
<script src="../js/core.js"></script><script src="../js/track.js"></script><script src="../js/motion.js"></script><script src="../js/detectors.js"></script><script src="../js/audio.js"></script><script src="../js/audiologic.js"></script>
<script>
(async function () {
  var out = window.__harness = { done: false, ok: false, checks: {}, errors: [] }, L = document.getElementById('log');
  function log(s) { L.textContent += s + '\n'; }
  function chk(n, c, info) { out.checks[n] = { pass: !!c, info: info }; log((c ? 'PASS ' : 'FAIL ') + n + ' — ' + info); }
  async function img(src) { var i = new Image(); i.src = src; await i.decode(); return i; }
  function draw(id, im, ds) { var cv = document.getElementById(id), d = devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight; cv.width = w * d; cv.height = h * d; var c = cv.getContext('2d'); c.setTransform(d, 0, 0, d, 0, 0); var s = Math.min(w / im.naturalWidth, h / im.naturalHeight), ox = (w - im.naturalWidth * s) / 2, oy = (h - im.naturalHeight * s) / 2; c.drawImage(im, ox, oy, im.naturalWidth * s, im.naturalHeight * s);
    ds.forEach(function (x) { c.strokeStyle = '#9ACD32'; c.lineWidth = 2; c.strokeRect(ox + x.x * s, oy + x.y * s, x.w * s, x.h * s); c.fillStyle = '#000c'; c.fillRect(ox + x.x * s, oy + x.y * s, 110, 16); c.fillStyle = '#9ACD32'; c.font = '700 12px sans-serif'; c.fillText(x.cls + ' ' + Math.round(x.score * 100) + '%', ox + x.x * s + 3, oy + x.y * s + 12); }); }
  try {
    var im = await img('person_dog.jpg'), W = im.naturalWidth, H = im.naturalHeight; out.models = {};
    for (var cfg of [['effdet0', 'cA'], ['yolo11n', 'cB'], ['coco-lite', 'cC']]) {
      var t0 = performance.now(), M = await SDet2.load(cfg[0]), lm = performance.now() - t0, ts = [], r;
      for (var i = 0; i < 3; i++) { r = await SDet2.detect(im, W, H, { floor: 0.3, iou: 0.5 }); ts.push(Math.round(r.t.pre + r.t.infer + r.t.post)); }
      var s = r.dets.map(function (d) { return d.cls + ' ' + d.score.toFixed(2); }).join(', ');
      out.models[cfg[0]] = { backend: M.backend, inputSize: M.inputSize, loadMs: Math.round(lm), ms: ts, dets: s }; draw(cfg[1], im, r.dets);
      chk('detector ' + cfg[0] + ' person+dog', r.dets.some(function (d) { return d.cls === 'person'; }) && r.dets.some(function (d) { return d.cls === 'dog'; }), s + ' | ' + M.backend + ' @' + M.inputSize + ' load ' + Math.round(lm) + 'ms, ' + ts.join('/') + 'ms');
    }
    // letterbox mapping check: boxes for a horizontally padded and a vertically padded version must agree
    var cv = document.createElement('canvas'); cv.width = W * 2; cv.height = H; var cx = cv.getContext('2d'); cx.fillStyle = '#777'; cx.fillRect(0, 0, cv.width, H); cx.drawImage(im, W, 0);
    await SDet2.load('effdet0'); var a = (await SDet2.detect(im, W, H, { floor: 0.3 })).dets.filter(function (d) { return d.cls === 'dog'; })[0], b = (await SDet2.detect(cv, cv.width, H, { floor: 0.3 })).dets.filter(function (d) { return d.cls === 'dog'; })[0];
    chk('letterbox → source mapping consistent', a && b && STrack.iou(a, { x: b.x - W, y: b.y, w: b.w, h: b.h }) > 0.6, a && b ? 'IoU ' + STrack.iou(a, { x: b.x - W, y: b.y, w: b.w, h: b.h }).toFixed(2) : 'missing');
    // temporal confirmation over a repeated frame sequence
    var tr = new STrack.Tracker(), conf = 0; for (var f = 0; f < 6; f++) { var rr = await SDet2.detect(im, W, H, { floor: 0.15 }); conf += tr.update(rr.dets, W, H, f * 200).confirmed.length; }
    chk('tracker confirms person+dog on 6-frame sequence', conf >= 2 && tr.tracks.filter(function (t) { return t.state === 'confirmed'; }).length >= 2, conf + ' confirmed; ' + tr.tracks.map(function (t) { return t.label + ':' + t.state; }).join(', '));
    // ---- YAMNet + v2 audio logic ----
    await tf.setBackend('webgl'); var t2 = performance.now(); await SAudio.load(); var yl = performance.now() - t2;
    var buf = await (await fetch('dog_bark.wav')).arrayBuffer(), dv = new DataView(buf), off = 12, pcm = null;
    while (off < buf.byteLength) { var id = String.fromCharCode(dv.getUint8(off), dv.getUint8(off + 1), dv.getUint8(off + 2), dv.getUint8(off + 3)), sz = dv.getUint32(off + 4, true); if (id === 'data') { pcm = new Int16Array(buf.slice(off + 8, off + 8 + sz)); break; } off += 8 + sz; }
    var wave = Float32Array.from(pcm, function (v) { return v / 32768; }), res = [], best = {}, sm = new SAudioLogic.Smoother(SAudio.getClasses()), aev = [];
    for (var st = 0; st + SAudio.WIN <= wave.length; st += 8000) { var r2 = await SAudio.classify(wave.subarray(st, st + SAudio.WIN), 3); res.push(r2); r2.top.forEach(function (x) { best[x.label] = Math.max(best[x.label] || 0, x.score); }); sm.push(r2.scores, -20, st / 16).events.forEach(function (e) { aev.push(e.cat); }); }
    var ranked = Object.keys(best).sort(function (a, b) { return best[b] - best[a]; }).slice(0, 4);
    out.yamnet = { loadMs: Math.round(yl), windows: res.length, ms: res.map(function (r) { return Math.round(r.ms); }), best: ranked.map(function (l) { return l + ' ' + best[l].toFixed(2); }), v2Events: aev };
    document.getElementById('yam').innerHTML = ranked.map(function (l) { return '<div class="srow"><span>' + l + '</span><div class="bar"><i style="width:' + best[l] * 100 + '%"></i></div><b>' + Math.round(best[l] * 100) + '%</b></div>'; }).join('') + '<div class="muted">v2 watch events: ' + aev.join(', ') + '</div>';
    chk('yamnet dog bark → Dog class', res.some(function (r) { return r.top.some(function (x) { return /^dog$|bark|bow-wow/i.test(x.label); }); }), out.yamnet.best.join(', '));
    chk('v2 audio logic raises Dog watch event', aev.indexOf('Dog') >= 0, aev.join(','));
    out.ok = Object.keys(out.checks).every(function (k) { return out.checks[k].pass; });
    document.getElementById('verdict').innerHTML = out.ok ? '<b style="color:var(--acid)">ALL HARNESS CHECKS PASSED</b>' : '<b style="color:var(--danger)">SOME CHECKS FAILED</b>';
  } catch (e) { out.errors.push(String(e && e.stack || e)); log('ERROR ' + e); }
  out.done = true;
})();
</script></body></html>
